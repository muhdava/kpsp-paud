{% extends "base.html" %}{% block body %}
<div class="auth kartu">
  <h1>Akun</h1>
  <p class="redup kecil">{{ user.nama }} · <b>{{ user.username }}</b> · {{ 'Guru ' ~ user.paud_nama if user.peran=='guru' else 'Petugas Puskesmas' }}</p>
  <h2>Ganti password</h2>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <div style="margin-bottom:12px"><label>Password lama</label><input type="password" name="lama" required autocomplete="current-password"></div>
    <div style="margin-bottom:16px"><label>Password baru (min. 6)</label><input type="password" name="baru" required minlength="6" autocomplete="new-password"></div>
    <button class="btn">Simpan</button>
  </form>
</div>
{% endblock %}
