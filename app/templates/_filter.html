<form class="kartu filter noprint reveal" method="get">
  <div><label>Kelurahan</label><select name="kelurahan"><option value="">Semua</option>{% for k in opsi_kel %}<option value="{{ k.id }}" {{ 'selected' if args.kelurahan==k.id|string }}>{{ k.nama }}</option>{% endfor %}</select></div>
  <div><label>PAUD / TK</label><select name="paud"><option value="">Semua</option>{% for p in opsi_paud %}<option value="{{ p.id }}" {{ 'selected' if args.paud==p.id|string }}>{{ p.nama }} ({{ p.kel }})</option>{% endfor %}</select></div>
  <div><label>Periksa dari</label><input type="date" name="dari" value="{{ args.dari }}"></div>
  <div><label>Sampai</label><input type="date" name="sampai" value="{{ args.sampai }}"></div>
  {% if lengkap %}
  <div><label>Hasil KPSP</label><select name="kpsp"><option value="">Semua</option>{% for k in ['Sesuai umur','Meragukan','Penyimpangan'] %}<option {{ 'selected' if args.kpsp==k }}>{{ k }}</option>{% endfor %}</select></div>
  <div><label>Status gizi</label><select name="gizi"><option value="">Semua</option>{% for k in ['Gizi buruk','Gizi kurang','Gizi baik','Berisiko gizi lebih','Gizi lebih','Obesitas'] %}<option {{ 'selected' if args.gizi==k }}>{{ k }}</option>{% endfor %}</select></div>
  <div><label>Tindak lanjut</label><select name="tl"><option value="">Semua</option>{% for k in TINDAK_LANJUT %}<option {{ 'selected' if args.tl==k }}>{{ k }}</option>{% endfor %}</select></div>
  <div><label>Nama anak</label><input name="cari" value="{{ args.cari }}"></div>
  {% endif %}
  <div><label>Data</label><select name="terakhir"><option value="1">Skrining terakhir per anak</option><option value="0" {{ 'selected' if args.terakhir=='0' }}>Semua skrining</option></select></div>
  <div class="aksi"><button class="btn">Terapkan</button><a href="{{ request.path }}" class="btn alt">Reset</a></div>
</form>
